<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>派对入场</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="password.css">
  <script src="password.js" defer></script>
</head>
<body>
  <main class="entrance">
    <form class="entrance-card" action="/api/unlock" method="post" aria-labelledby="entrance-title" novalidate>
      <div class="entrance-heading">
        <h1 id="entrance-title">派对入场</h1>
        <span class="entrance-lock" aria-hidden="true"><i></i></span>
      </div>
      <label for="entrance-code">四位入场密码</label>
      <input id="entrance-code" name="password" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required aria-describedby="entrance-status">
      <p class="entrance-status" id="entrance-status" role="status"></p>
      <button type="submit">解锁派对</button>
    </form>
  </main>
</body>
</html>
